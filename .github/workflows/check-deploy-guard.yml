name: check-deploy-guard

# B8.4 (AP-8) — structural CI guard that fails any PR which removes
# scripts/pull-deploy.sh's load-bearing invariants.
#
# ai-roster-adviser uses split deploy (same shape as ai-calendar-adviser):
# pull-deploy.sh ships in this repo (self-installed onto the VPS at
# /opt/ai-roster-adviser-deploy/pull-deploy.sh) and delegates the heavy
# lifting to /opt/ai-roster-adviser-deploy/deploy.sh.
#
# AI4 (2026-06-15) — scripts/deploy.sh IS now version-controlled in this
# repo (added in #24 as source-of-truth) AND the puller self-installs it to
# the VPS on each successful deploy, exactly like pull-deploy.sh. Before AI4
# the box copy drifted silently (the `git checkout -fB` wedge fix lived only
# on the VPS). So B8.4 can now ALSO mirror B8.2's "grep scripts/deploy.sh
# for git reset" guard — the reset happens in a file that IS in this repo to
# check. (The prior comment here said deploy.sh was "NOT version-controlled
# here"; that was true when this guard was first written and is now stale.)
#
# What is guarded: the puller's contribution to the deploy contract —
# structural invariants whose silent removal would turn the deploy chain
# back into a silent-failure surface:
#
#   1. `set -euo pipefail` — fail-loud bash mode. Without this, an
#      intermediate command failing mid-tick (git fetch, install,
#      deploy.sh invocation) gets swallowed and the puller keeps
#      running on stale state.
#   2. Self-install via `install -m 755 ... "$STABLE_PATH"`. Without
#      this, the stable puller copy on the VPS never updates and any
#      pull-deploy.sh-side fix can't ship to production.
#   3. `"$DEPLOY_SCRIPT"` invocation. Without this, the puller does
#      nothing — fetches HEAD, notices it changed, and never delegates
#      to the actual deploy machinery.
#   4. (AI4) deploy.sh self-install via `install -m 755 ... "$DEPLOY_SCRIPT"`.
#      Without this, the VPS deploy.sh drifts silently from scripts/deploy.sh
#      again — the exact failure AI4 fixed.
#   5. (AI4) scripts/deploy.sh uses force-checkout (`git checkout -fB`) +
#      `git reset --hard`. A plain `-B` aborts on the dirty package-lock that
#      `npm prune` leaves, wedging any dependency-changing deploy on stale code.
#
# Same blast-radius semantics as B8.1 / B8.2 / B8.3 (deployed code MUST
# match a committed HEAD on origin/main + every layer of the deploy
# chain fail-loud on error); same mechanical shape as B8.3 because
# ai-roster-adviser and ai-calendar-adviser have parallel deploy models.
#
# Reading: https://github.com/hamlet-archer/ai-ops-meta/blob/main/architect-backlog.md#b8

on:
  pull_request:
    paths:
      - 'scripts/pull-deploy.sh'
      - 'scripts/deploy.sh'
      - '.github/workflows/check-deploy-guard.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/pull-deploy.sh'
      - 'scripts/deploy.sh'
      - '.github/workflows/check-deploy-guard.yml'

jobs:
  no-silent-puller-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify scripts/pull-deploy.sh exists
        run: |
          test -f scripts/pull-deploy.sh || {
            echo "::error::scripts/pull-deploy.sh missing — B8.4 (AP-8) requires the in-repo puller"
            exit 1
          }

      - name: Verify scripts/pull-deploy.sh fails loud + self-installs + invokes deploy.sh
        run: |
          if ! grep -qE 'set -euo pipefail' scripts/pull-deploy.sh; then
            echo "::error file=scripts/pull-deploy.sh::B8.4 (AP-8) guard removed — pull-deploy.sh no longer enables 'set -euo pipefail'"
            echo "  rationale: without fail-loud bash, intermediate failures (git fetch, install, deploy.sh invocation) get swallowed and the puller keeps running on stale state."
            echo "  see: https://github.com/hamlet-archer/ai-ops-meta/blob/main/architect-backlog.md#b8"
            exit 1
          fi
          if ! grep -qE 'install -m 755 .* "\$STABLE_PATH"' scripts/pull-deploy.sh; then
            echo "::error file=scripts/pull-deploy.sh::B8.4 (AP-8) guard removed — pull-deploy.sh no longer self-installs the stable copy via 'install -m 755 ... \"\$STABLE_PATH\"'"
            echo "  rationale: without it, the stable puller copy on the VPS never updates and any pull-deploy.sh-side fix can't ship to production."
            exit 1
          fi
          if ! grep -qE '"\$DEPLOY_SCRIPT"' scripts/pull-deploy.sh; then
            echo "::error file=scripts/pull-deploy.sh::B8.4 (AP-8) guard removed — pull-deploy.sh no longer invokes \"\$DEPLOY_SCRIPT\""
            echo "  rationale: without this, the puller fetches HEAD and notices it changed but never delegates to the actual deploy machinery."
            exit 1
          fi
          echo "B8.4 guard verified: scripts/pull-deploy.sh sets -euo pipefail + self-installs via install -m 755 + invokes \$DEPLOY_SCRIPT."

      - name: Verify scripts/pull-deploy.sh self-installs deploy.sh (AI4)
        run: |
          if ! grep -qE 'install -m 755 .* "\$DEPLOY_SCRIPT"' scripts/pull-deploy.sh; then
            echo "::error file=scripts/pull-deploy.sh::AI4 guard removed — pull-deploy.sh no longer self-installs deploy.sh via 'install -m 755 ... \"\$DEPLOY_SCRIPT\"'"
            echo "  rationale: without it, the VPS /opt/ai-roster-adviser-deploy/deploy.sh drifts silently from scripts/deploy.sh — the on-box -fB wedge fix lived only on the VPS before AI4."
            echo "  see: https://github.com/hamlet-archer/ai-ops-meta/blob/main/architect-backlog.md (AI4)"
            exit 1
          fi
          echo "AI4 guard verified: scripts/pull-deploy.sh self-installs deploy.sh to \$DEPLOY_SCRIPT."

      - name: Verify scripts/deploy.sh exists + force-checkouts + git reset --hard (AI4 / B8.2 shape)
        run: |
          test -f scripts/deploy.sh || {
            echo "::error::scripts/deploy.sh missing — AI4 requires the in-repo deploy script (it is the self-installed source of truth)"
            exit 1
          }
          if ! grep -qE 'git checkout -fB main origin/main' scripts/deploy.sh; then
            echo "::error file=scripts/deploy.sh::AI4 guard — deploy.sh no longer force-checkouts (git checkout -fB main origin/main)"
            echo "  rationale: a plain 'git checkout -B' aborts on the dirty package-lock.json that 'npm prune --omit=dev' leaves, wedging any dependency-changing deploy on stale code."
            exit 1
          fi
          if ! grep -qE 'git reset --hard origin/main' scripts/deploy.sh; then
            echo "::error file=scripts/deploy.sh::B8.2-shape guard — deploy.sh no longer 'git reset --hard origin/main'"
            echo "  rationale: deployed code MUST match committed HEAD on origin/main; a missing hard reset lets the box run divergent state."
            exit 1
          fi
          echo "AI4 guard verified: scripts/deploy.sh force-checkouts (-fB) + git reset --hard origin/main."

      - name: Verify scripts/pull-deploy.sh has the B8.10.4 post-daemon-reload drift check
        # B8.10.4 — pins the post-daemon-reload drift check against silent
        # removal. The check lives in pull-deploy.sh (not scripts/deploy.sh
        # like in ai-comms-adviser) because ai-roster-adviser's deploy.sh
        # is a VPS-side artifact not tracked in this repo. Greps for the
        # structural signatures: systemctl cat (source of truth for running
        # unit text), tail -n +2 (header strip), and a FAILED exit-1 path.
        run: |
          if ! grep -qE 'systemctl cat' scripts/pull-deploy.sh; then
            echo "::error file=scripts/pull-deploy.sh::B8.10.4 guard removed — drift check no longer uses 'systemctl cat'"
            echo "  rationale: the running systemd view is the source of truth for the post-daemon-reload comparison."
            echo "  see: https://github.com/hamlet-archer/ai-ops-meta/blob/main/architect-backlog.md#b8104"
            exit 1
          fi
          if ! grep -qE 'tail -n \+2' scripts/pull-deploy.sh; then
            echo "::error file=scripts/pull-deploy.sh::B8.10.4 guard removed — drift check no longer strips the systemctl-cat header"
            echo "  rationale: without the header strip every unit appears drifted."
            exit 1
          fi
          if ! grep -qiE 'drift.*FAILED|drift_ok|drift check' scripts/pull-deploy.sh; then
            echo "::error file=scripts/pull-deploy.sh::B8.10.4 guard removed — drift check has no FAILED exit-1 path"
            echo "  rationale: the check must surface drift via exit 1, not just log a warning."
            exit 1
          fi
          echo "B8.10.4 guard verified: scripts/pull-deploy.sh runs the post-daemon-reload drift check."
